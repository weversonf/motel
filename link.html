<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Links</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            padding: 40px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            text-align: center;
        }
        .avatar {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: #fff; font-weight: 700;
            margin: 0 auto 12px;
        }
        h1 { font-size: 1.3rem; color: #1a1a2e; margin-bottom: 4px; }
        .subtitle { font-size: .8rem; color: #888; margin-bottom: 24px; }
        .links { display: flex; flex-direction: column; gap: 10px; }
        .link-btn {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px; border-radius: 14px;
            background: #f5f5f8; color: #1a1a2e;
            text-decoration: none; font-size: .95rem;
            transition: all .2s; border: 1px solid #eee;
        }
        .link-btn:hover { background: #eee; transform: translateY(-1px); }
        .link-btn .icon { font-size: 1.3rem; }
        .link-btn .text { flex: 1; text-align: left; font-weight: 500; }
        .link-btn .arrow { color: #999; font-size: .8rem; }
        .loading { text-align: center; padding: 40px 0; color: #888; }
        .spinner { width: 32px; height: 32px; border: 3px solid #eee; border-top-color: #667eea; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #e74c3c; padding: 20px; text-align: center; }
        .footer { margin-top: 24px; font-size: .7rem; color: #bbb; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Carregando...</div>
        </div>
        <div class="error" id="error" style="display:none"></div>
        <div id="content" style="display:none">
            <div class="avatar" id="avatar">🔗</div>
            <h1 id="nomeEstabelecimento">Carregando...</h1>
            <div class="subtitle" id="subtitle">Links</div>
            <div class="links" id="linksList"></div>
            <div class="footer">Com ♥ por Rose</div>
        </div>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCln4mcb1j46UcmG-sTVb3bUudTQCpdfvY",
            authDomain: "moteisfortaleza-9dadd.firebaseapp.com",
            projectId: "moteisfortaleza-9dadd",
            storageBucket: "moteisfortaleza-9dadd.firebasestorage.app",
            messagingSenderId: "285292896374",
            appId: "1:285292896374:web:ef6d3ad37e94313ad3bf57"
        };
        try { firebase.initializeApp(firebaseConfig); } catch(e) {}
        const db = firebase.firestore();

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        (async function() {
            if (!id) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = '';
                document.getElementById('error').textContent = 'Link inválido.';
                return;
            }
            try {
                var estabSnap = await db.collection("estabelecimentos").doc(id).get();
                if (!estabSnap.exists) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').style.display = '';
                    document.getElementById('error').textContent = 'Estabelecimento não encontrado.';
                    return;
                }
                var estab = estabSnap.data();
                document.getElementById('nomeEstabelecimento').textContent = estab.nome || 'Links';
                document.getElementById('avatar').textContent = (estab.nome || 'L').charAt(0).toUpperCase();

                var linksSnap = await db.collection("estabelecimentos").doc(id).collection("linktree").get();
                var links = [];
                linksSnap.forEach(function(d) {
                    var data = d.data();
                    if (data.ativo !== false) links.push(data);
                });
                links.sort(function(a, b) { return (a.ordem || 0) - (b.ordem || 0); });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = '';

                if (!links.length) {
                    document.getElementById('linksList').innerHTML = '<div style="padding:20px;color:#888">Nenhum link disponível.</div>';
                    return;
                }

                var h = '';
                links.forEach(function(l) {
                    var url = l.url || '#';
                    if (!url.startsWith('http://') && !url.startsWith('https://') && url !== '#') url = 'https://' + url;
                    h += '<a class="link-btn" href="' + url + '" target="_blank" rel="noopener noreferrer">';
                    h += '<span class="icon">' + (l.icon || '🔗') + '</span>';
                    h += '<span class="text">' + (l.title || 'Link') + '</span>';
                    h += '<span class="arrow">→</span>';
                    h += '</a>';
                });
                document.getElementById('linksList').innerHTML = h;
            } catch(e) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = '';
                document.getElementById('error').textContent = 'Erro ao carregar: ' + e.message;
            }
        })();
    </script>
</body>
</html>
