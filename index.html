<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Reserva - Moteis Fortaleza</title>

    <script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore-compat.js"></script>
    <style>
        :root, [data-theme="light"] {
            --primary: #d20150;
            --bg: #f0e8f0;
            --surface: #ffffff;
            --text: #1a1a2e;
            --text2: #7a5a8a;
            --text3: #b8a0c8;
            --bot-bg: #faf0ff;
            --bot-text: #4a2a5a;
            --bot-border: #f0e0f8;
            --header-bg: #ffffff;
            --header-border: #f0e0f8;
            --input-bg: #faf0ff;
            --input-border: #e0d0e8;
            --input-focus: #d20150;
            --card-bg: #ffffff;
            --card-border: #f0e0f8;
            --shadow: rgba(210,1,80,.1);
            --disclaimer-bg: #faf0ff;
        }
        [data-theme="noir"] {
            --primary: #d20150;
            --bg: #0a0a0a;
            --surface: #050505;
            --text: #f0e0f8;
            --text2: #b8a0c8;
            --text3: #555;
            --bot-bg: rgba(210,1,80,.1);
            --bot-text: #e8c8f0;
            --bot-border: rgba(210,1,80,.15);
            --header-bg: #0a0a0a;
            --header-border: rgba(210,1,80,.15);
            --input-bg: #1a1a2a;
            --input-border: #333;
            --card-bg: #111;
            --card-border: #222;
            --shadow: rgba(210,1,80,.15);
            --disclaimer-bg: #0a0a0a;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; }
        body { background:var(--bg); display:flex; justify-content:center; align-items:center; min-height:100vh; padding:10px; color:var(--text); transition:background .3s; }
        .chat-container { width:100%; max-width:450px; background:var(--surface); border-radius:20px; box-shadow:0 8px 40px var(--shadow); display:flex; flex-direction:column; height:90vh; max-height:780px; overflow:hidden; border:1px solid var(--bot-border); transition:all .3s; }
        .chat-header { padding:16px 20px; text-align:center; font-weight:700; font-size:1rem; letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid var(--header-border); display:flex; justify-content:center; align-items:center; gap:8px; background:var(--header-bg); color:var(--primary); position:relative; transition:all .3s; }
        .theme-toggle { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:1px solid var(--bot-border); border-radius:20px; padding:4px 10px; font-size:.7rem; cursor:pointer; color:var(--text2); transition:.2s; }
        .theme-toggle:hover { border-color:var(--primary); color:var(--primary); }
        .chat-box { flex:1; padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth; background:var(--surface); transition:background .3s; }
        .msg { padding:14px 18px; border-radius:16px; max-width:88%; line-height:1.5; font-size:.92rem; animation:fadeIn .3s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        .msg.bot { background:var(--bot-bg); color:var(--bot-text); align-self:flex-start; border-bottom-left-radius:4px; border:1px solid var(--bot-border); }
        .msg.user { background:var(--primary); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; box-shadow:0 2px 8px var(--shadow); }
        .ui-box { margin-top:4px; display:flex; flex-direction:column; gap:10px; width:100%; }
        .ui-box input,.ui-box select { padding:14px; border:1px solid var(--input-border); border-radius:12px; font-size:.95rem; width:100%; outline:none; background:var(--input-bg); color:var(--text); transition:.2s; }
        .ui-box input:focus,.ui-box select:focus { border-color:var(--primary); }
        .ui-box label { color:var(--primary); font-size:.8rem; font-weight:600; letter-spacing:.3px; }
        .btn-action { padding:14px; background:var(--primary); color:#fff; border:none; border-radius:12px; cursor:pointer; font-weight:600; width:100%; font-size:.95rem; transition:.2s; letter-spacing:.3px; }
        .btn-action:hover { transform:translateY(-1px); box-shadow:0 6px 20px var(--shadow); }
        .btn-action:active { transform:scale(.98); }
        .card-select { background:var(--card-bg); border:1px solid var(--card-border); border-radius:16px; overflow:hidden; cursor:pointer; transition:.25s; min-width:100px; flex:0 0 auto; text-align:center; padding:16px 12px 12px; }
        .card-select:hover { border-color:var(--cor); box-shadow:0 4px 20px var(--cor-sombra); transform:translateY(-3px) scale(1.02); }
        .card-select .card-logo { font-size:2rem; line-height:1; }
        .card-select .card-nome { font-weight:700; font-size:.8rem; color:var(--cor); letter-spacing:.5px; margin-top:6px; }
        .card-select .card-sub { color:var(--text3); font-size:.65rem; margin-top:3px; }
        .card-row { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; padding:4px 0 12px; scrollbar-width:thin; scrollbar-color:var(--bot-border) transparent; }
        .card-row::-webkit-scrollbar { height:4px; }
        .card-row::-webkit-scrollbar-thumb { background:var(--bot-border); border-radius:4px; }
        .card-row .card-select { scroll-snap-align:start; }
        .input-area { display:none; padding:16px 20px; gap:8px; background:var(--disclaimer-bg); border-top:1px solid var(--bot-border); }
        .input-area input { flex:1; padding:12px 18px; border:1px solid var(--input-border); border-radius:24px; outline:none; background:var(--input-bg); color:var(--text); font-size:.95rem; }
        .input-area input:focus { border-color:var(--primary); }
        .input-area button { padding:12px 22px; background:var(--primary); color:#fff; border:none; border-radius:24px; cursor:pointer; font-weight:600; transition:.2s; }
        .input-area button:hover { transform:translateY(-1px); box-shadow:0 4px 16px var(--shadow); }
        .resumo-item { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--bot-border); font-size:.9rem; }
        .resumo-item span:last-child { color:var(--primary); font-weight:600; }
        .badge-pendente { color:#f59e0b; font-size:.75rem; margin-top:10px; text-align:center; }
        .disclaimer { font-size:.7rem; color:var(--text3); text-align:center; padding:10px 20px; background:var(--disclaimer-bg); border-top:1px solid var(--bot-border); transition:background .3s; }
    </style>
</head>

        var APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzAVBD7ReZHQN-vLMEQem8HhnOuAobesEq3OI4W78y1lRAUHhDT_FOUoZg7nV-p9GYV1w/exec";

        // Theme toggle (same approach as dashboard_v02)
        window.toggleTheme = function() {
            var html = document.documentElement;
            var atual = html.getAttribute('data-theme');
            var nova = atual === 'noir' ? 'light' : 'noir';
            html.setAttribute('data-theme', nova);
            localStorage.setItem('chatTheme', nova);
            document.getElementById('themeBtn').textContent = nova === 'noir' ? '☀️' : '🌙';
        };
        try {
            var saved = localStorage.getItem('chatTheme');
            if (saved === 'noir') {
                document.documentElement.setAttribute('data-theme', 'noir');
                document.getElementById('themeBtn').textContent = '☀️';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        } catch(e) {}

        function addMsg(text, sender) {
            var div = document.createElement('div');
            div.className = 'msg ' + sender;
            div.innerHTML = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
        window.voltar = function() {
            if (step <= 0) return;
            step--;
            removerUIAnterior();
            var msgs = chat.querySelectorAll('.msg');
            for (var i = msgs.length - 1; i >= 0; i--) {
                if (msgs[i].classList.contains('user')) { msgs[i].remove(); break; }
            }
            setTimeout(nextStep, 300);
        };
        window.handleEnter = function(e) { if (e.key === 'Enter') window.handleText(); };
        function toggleUI(show) { inputArea.style.display = show ? 'flex' : 'none'; }
        function removerUIAnterior() { document.querySelectorAll('.ui-box').forEach(function(u){ u.remove(); }); }

        var local = new Date();
        local.setMinutes(local.getMinutes() - local.getTimezoneOffset());
        var hojeLocal = local.toISOString().split('T')[0];

        function renderUI(type) {
            toggleUI(false);
            var div = document.createElement('div');
            div.className = 'ui-box msg bot';
            if (type === 'cpf') {
                div.innerHTML = '<label>CPF (Apenas números):</label>'
                    + '<input type="text" id="uiCpf" placeholder="000.000.000-00" maxlength="14" oninput="window.mascaraCPF(this)" onkeypress="window.handleEnterUI(event,\'cpf\')">'
                    + '<button class="btn-action" onclick="window.processarUI(\'cpf\')">Confirmar CPF</button>'
                    + '<div style="text-align:center;margin-top:6px"><span onclick="window.voltar()" style="color:#666;font-size:.8rem;cursor:pointer;text-decoration:underline">← Voltar</span></div>';
            } else if (type === 'dataRes') {
                div.innerHTML = '<label>Data da reserva:</label>'
                    + '<input type="date" id="uiDataRes" min="' + hojeLocal + '" onkeypress="window.handleEnterUI(event,\'dataRes\')">'
                    + '<button class="btn-action" onclick="window.processarUI(\'dataRes\')">Verificar disponibilidade</button>'
                    + '<div id="disponibilidadeMsg" style="display:none;padding:8px;border-radius:8px;font-size:.85rem;text-align:center"></div>'
                    + '<div style="text-align:center;margin-top:6px"><span onclick="window.voltar()" style="color:#666;font-size:.8rem;cursor:pointer;text-decoration:underline">← Voltar</span></div>';
            } else if (type === 'horaRes') {
                div.innerHTML = '<label>Horário de chegada:</label>'
                    + '<input type="time" id="uiHoraRes" onkeypress="window.handleEnterUI(event,\'horaRes\')">'
                    + '<button class="btn-action" onclick="window.processarUI(\'horaRes\')">Confirmar Horário</button>'
                    + '<div style="text-align:center;margin-top:6px"><span onclick="window.voltar()" style="color:#666;font-size:.8rem;cursor:pointer;text-decoration:underline">← Voltar</span></div>';
            } else if (type === 'finalizar') {
                var corPreco = motels[userData.motel] ? motels[userData.motel].cor : '#d20150';
                var vDesc = Math.round(userData.precoOriginal * 0.7);
                div.innerHTML = ''
                    + '<div class="resumo-item"><span>Motel</span><span>' + userData.motel + '</span></div>'
                    + '<div class="resumo-item"><span>Suíte</span><span>' + userData.suite + '</span></div>'
                    + '<div class="resumo-item"><span>Período</span><span>' + userData.duracao + '</span></div>'
                    + '<div class="resumo-item"><span>Valor</span><span>R$ ' + userData.precoOriginal + ',00</span></div>'
                    + '<div class="resumo-item"><span>Data</span><span>' + userData.dataRes.split('-').reverse().join('/') + '</span></div>'
                    + '<div class="resumo-item"><span>Horário</span><span>' + userData.horaRes + '</span></div>'
                    + '<div class="resumo-item"><span>Cliente</span><span>' + userData.nome + '</span></div>'
                    + '<div class="resumo-item"><span>CPF</span><span>' + userData.cpf + '</span></div>'
                    + '<div style="margin:14px 0;padding:12px;background:rgba(255,215,0,.08);border-radius:12px;border:1px solid rgba(255,215,0,.2);text-align:center;font-size:.85rem">'

                    + '<span style="color:' + corPreco + '">🔥 30% de desconto</span> ou <span style="color:' + corPreco + '">🎁 +3h grátis</span> (total 6h)'
                    + '</div>'

                    + '<button class="btn-action" style="background:#666" onclick="window.confirmarCartao()">💳 Pagar com Cartão</button>'
                    + '<div style="text-align:center;margin-top:6px"><span onclick="window.voltar()" style="color:#666;font-size:.8rem;cursor:pointer;text-decoration:underline">← Voltar</span></div>'

            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            var inp = div.querySelector('input, select');
            if (inp) inp.focus();
        }

        window.handleEnterUI = function(e, type) { if (e.key === 'Enter') window.processarUI(type); };
        window.handleText = function() {
            var text = userInput.value.trim();
            if (!text) return;
            addMsg(text, 'user');
            userInput.value = '';
            if (step === 0) { userData.nome = text; step++; setTimeout(nextStep, 400); }
        };
        window.mascaraCPF = function(i) {
            i.value = i.value.replace(/\D/g,"");
            i.value = i.value.replace(/(\d{3})(\d)/,"$1.$2");
            i.value = i.value.replace(/(\d{3})(\d)/,"$1.$2");
            i.value = i.value.replace(/(\d{3})(\d{1,2})$/,"$1-$2");
        };

        function renderMotelCards() {
            toggleUI(false);
            var div = document.createElement('div');
            div.className = 'ui-box msg bot';
            div.style.background = 'transparent'; div.style.border = 'none'; div.style.padding = '0';
            var row = document.createElement('div');
            row.className = 'card-row';
            Object.keys(motels).forEach(function(nome) {
                var m = motels[nome];
                row.innerHTML += '<div class="card-select" style="--cor:' + m.cor + ';--cor-sombra:' + m.cor + '66" onclick="window.selectMotel(\'' + nome + '\')">'

                    + '<div class="card-nome">' + nome + '</div>'
                    + '<div class="card-sub">' + m.suites.length + ' suítes</div></div>';
            });
            div.appendChild(row);
            div.innerHTML += '<div style="text-align:center;margin-top:6px"><span onclick="window.voltar()" style="color:#666;font-size:.8rem;cursor:pointer;text-decoration:underline">← Voltar</span></div>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function aplicarCorChat(cor) {
            document.documentElement.style.setProperty('--primary', cor);
            document.querySelector('.chat-header').style.color = cor;
            document.querySelector('.chat-header').style.borderBottomColor = cor + '44';
            document.querySelector('.chat-container').style.boxShadow = '0 8px 40px ' + cor + '1A';
            document.querySelector('.chat-container').style.borderColor = cor + '22';
        }

        window.selectMotel = function(nome) {
            userData.motel = nome;
            var motel = motels[nome];
            if (motel && motel.cor) aplicarCorChat(motel.cor);
            addMsg(nome, 'user');
            step++;
            removerUIAnterior();
            setTimeout(nextStep, 400);
        };

                    + '<div style="font-size:.75rem;color:#aaa;margin-top:4px">3h R$ ' + s.preco3 + ' · 12h R$ ' + s.preco12 + ' · 24h R$ ' + s.preco24 + '</div></div></div>';
            });
            div.innerHTML += '<div style="text-align:center;margin-top:6px"><span onclick="window.voltar()" style="color:#666;font-size:.8rem;cursor:pointer;text-decoration:underline">← Voltar</span></div>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        window.selectSuite = function(nome) {
            userData.suite = nome;
            addMsg(nome, 'user');
            step++;
            removerUIAnterior();
            setTimeout(nextStep, 400);
        };

        function renderDuracao() {
            toggleUI(false);
            var div = document.createElement('div');
            div.className = 'ui-box msg bot';
            div.style.background = 'transparent'; div.style.border = 'none';
            var s = motels[userData.motel].suites.find(function(x){ return x.nome === userData.suite; });
            var cor = motels[userData.motel].cor;
            div.innerHTML = ''
                + '<div class="card-select" style="--cor:' + cor + ';--cor-sombra:' + cor + '66" onclick="window.selectDuracao(\'3h\',' + s.preco3 + ')">'
                + '<div style="padding:14px;font-weight:bold;color:var(--cor);text-align:center;font-size:1rem">⏱️ 3 Horas <span style="color:#888;font-weight:normal">R$ ' + s.preco3 + '</span></div></div>'
                + '<div class="card-select" style="--cor:' + cor + ';--cor-sombra:' + cor + '66" onclick="window.selectDuracao(\'12h\',' + s.preco12 + ')">'
                + '<div style="padding:14px;font-weight:bold;color:var(--cor);text-align:center;font-size:1rem">🌙 12 Horas <span style="color:#888;font-weight:normal">R$ ' + s.preco12 + '</span></div></div>'
                + '<div class="card-select" style="--cor:' + cor + ';--cor-sombra:' + cor + '66" onclick="window.selectDuracao(\'24h\',' + s.preco24 + ')">'
                + '<div style="padding:14px;font-weight:bold;color:var(--cor);text-align:center;font-size:1rem">🌞 24 Horas <span style="color:#888;font-weight:normal">R$ ' + s.preco24 + '</span></div></div>'
                + '<div style="text-align:center;margin-top:6px"><span onclick="window.voltar()" style="color:#666;font-size:.8rem;cursor:pointer;text-decoration:underline">← Voltar</span></div>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        window.selectDuracao = function(duracao, preco) {
            userData.duracao = duracao;
            userData.preco = preco;
            userData.precoOriginal = preco;
            addMsg(duracao + ' - R$ ' + preco, 'user');
            step++;
            removerUIAnterior();
            setTimeout(nextStep, 400);
        };

        async function verificarDisponibilidade(data) {
            var msgDiv = document.getElementById('disponibilidadeMsg');
            if (!msgDiv) return true;
            msgDiv.style.display = 'block';
            msgDiv.innerHTML = '🔍 Verificando disponibilidade...';
            msgDiv.style.background = '#111';
            msgDiv.style.color = '#888';
            try {
                if (!db) return true;
                var snap = await db.collection("reservas").get();
                var docs = snap.docs;
                var todas = docs.map(function(d){ var o = d.data(); o._id = d.id; return o; });
                var statusAtivos = ['pendente_recepcao', 'aguardando_pagamento', 'confirmado'];
                var reservasData = todas.filter(function(r){ return r.data_reserva === data && statusAtivos.indexOf(r.status) >= 0; });
                var motelInfo = motels[userData.motel];
                var qtdeTotal = 1;
                if (motelInfo && motelInfo.suites) {
                    var sf = motelInfo.suites.find(function(s){ return s.nome === userData.suite; });
                    if (sf) qtdeTotal = sf.qtde || 1;
                }
                var reservasSuite = reservasData.filter(function(r){ return r.motel === userData.motel && r.suite === userData.suite; });
                if (reservasSuite.length >= qtdeTotal) {
                    var motelsLivres = Object.keys(motels).filter(function(nomeMotel){
                        if (nomeMotel === userData.motel) return false;
                        var suitesOcupadas = reservasData.filter(function(r){ return r.motel === nomeMotel; }).map(function(r){ return r.suite; });
                        return motels[nomeMotel].suites.some(function(s){ return suitesOcupadas.indexOf(s.nome) < 0; });
                    });
                    var msg = '❌ <b>' + userData.suite + '</b> lotada para ' + data.split('-').reverse().join('/') + ' (' + reservasSuite.length + '/' + qtdeTotal + ' reservada(s)). Que tal escolher <b>outra suíte</b> do ' + userData.motel + ' ou <b>outra data</b>?';
                    if (motelsLivres.length > 0) {
                        msg += '<br><br>📍 <b>Motéis com vagas nesta data:</b><br>';
                        motelsLivres.forEach(function(n){ msg += '<span style="color:' + motels[n].cor + '">' + motels[n].icone + ' ' + n + '</span> · '; });
                        msg = msg.slice(0, -3);
                        msg += '<br><small style="color:#888">Toque no botão Voltar e escolha outro motel</small>';
                    }
                    msgDiv.innerHTML = msg;
                    msgDiv.style.background = 'rgba(255,0,0,0.15)';
                    msgDiv.style.color = '#ff6666';
                    return false;
                }
                var mesmoCPF = reservasData.find(function(r){ return r.cliente_cpf === userData.cpf; });
                if (mesmoCPF) {
                    userData.reservaExistente = mesmoCPF;
                    userData.reservaExistenteId = mesmoCPF._id;
                    msgDiv.innerHTML = '⚠️ Você já possui uma pré-reserva para ' + data.split('-').reverse().join('/') + '.<br><br>'
                        + '<span style="font-size:.85rem">Deseja alterar essa reserva ou criar uma nova?</span><br><br>'
                        + '<div style="display:flex;gap:8px;justify-content:center">'
                        + '<button class="btn-action" style="font-size:.8rem;padding:8px 16px;background:' + (motels[userData.motel] ? motels[userData.motel].cor : '#d20150') + '" onclick="window.prosseguirAposCPF(\'alterar\')">✏️ Alterar</button>'
                        + '<button class="btn-action" style="font-size:.8rem;padding:8px 16px;background:#666" onclick="window.prosseguirAposCPF(\'nova\')">➕ Criar Nova</button></div>';
                    msgDiv.style.background = 'rgba(255,200,0,0.15)';
                    msgDiv.style.color = '#ffcc00';
                    return false;
                }
                var dispMsg = qtdeTotal - reservasSuite.length;
                msgDiv.innerHTML = '✅ Data disponível! (' + dispMsg + ' vaga(s) restante(s) nesta suíte). Confirme o horário.';
                msgDiv.style.background = 'rgba(0,255,0,0.1)';
                msgDiv.style.color = 'var(--primary)';
                return true;
            } catch(e) {
                console.warn("Erro ao verificar disponibilidade:", e);
                msgDiv.innerHTML = '⚠️ Não foi possível verificar automaticamente. Sua reserva será analisada pela recepção.';
                msgDiv.style.background = 'rgba(255,200,0,0.1)';
                msgDiv.style.color = '#ffcc00';
                return true;
            }
        }

        window.prosseguirAposCPF = function(tipo) {
            if (tipo === 'alterar') {
                userData.alterandoReserva = true;
                addMsg('✏️ Alterar reserva existente', 'user');
            } else {
                delete userData.reservaExistente;
                delete userData.reservaExistenteId;
                addMsg('➕ Criar nova reserva', 'user');
            }
            step++;
            removerUIAnterior();
            setTimeout(nextStep, 500);
        };

        function validarCPF(cpf) {
            var nums = cpf.replace(/\D/g, '');
            if (nums.length !== 11 || /^(\d)\1{10}$/.test(nums)) return false;
            function calc(digitos, pesos) {
                var soma = 0;
                for (var i = 0; i < digitos.length; i++) soma += digitos[i] * pesos[i];
                var resto = soma % 11;
                return resto < 2 ? 0 : 11 - resto;
            }
            var d1 = calc(nums.slice(0,9).split('').map(Number), [10,9,8,7,6,5,4,3,2]);
            var d2 = calc(nums.slice(0,10).split('').map(Number), [11,10,9,8,7,6,5,4,3,2]);
            return d1 === Number(nums[9]) && d2 === Number(nums[10]);
        }

        window.processarUI = async function(tipo) {
            if (tipo === 'cpf') {
                var cpf = document.getElementById('uiCpf').value;
                if (cpf.length < 14) return;
                if (!validarCPF(cpf)) { alert('CPF inválido. Verifique os números.'); return; }
                addMsg(cpf, 'user'); userData.cpf = cpf; step++;
            } else if (tipo === 'dataRes') {
                var data = document.getElementById('uiDataRes').value;
                if (!data) return;
                addMsg(data.split('-').reverse().join('/'), 'user');
                userData.dataRes = data;
                var disponivel = await verificarDisponibilidade(data);
                if (!disponivel) {
                    document.getElementById('uiDataRes').value = '';
                    document.getElementById('uiDataRes').focus();
                    return;
                }
                step++; removerUIAnterior(); setTimeout(nextStep, 500); return;
            } else if (tipo === 'horaRes') {
                var hora = document.getElementById('uiHoraRes').value;
                if (!hora) return;
                var agora = new Date();
                var dataEscolhida = new Date(userData.dataRes + 'T' + hora + ':00');
                if (dataEscolhida < agora) { alert("⚠️ Horário inválido. Escolha um horário futuro."); return; }
                addMsg(hora, 'user'); userData.horaRes = hora; step++;
            }
            removerUIAnterior();
            setTimeout(nextStep, 500);
        };

        function nextStep() {
            switch (step) {
                case 0: addMsg("Olá! Bem-vindo à <b>Pré-Reserva Online</b>. Como você se chama?", 'bot'); toggleUI(true); userInput.focus(); break;
                case 1: addMsg("Prazer, " + userData.nome + "! Qual motel você deseja?", 'bot'); renderMotelCards(); break;
                case 2: addMsg("Qual suíte você prefere?", 'bot'); renderSuiteCards(); break;
                case 3: addMsg("Qual período deseja?", 'bot'); renderDuracao(); break;
                case 4: addMsg("Informe seu CPF:", 'bot'); renderUI('cpf'); break;
                case 5: addMsg("Para qual data deseja agendar no <b>" + userData.motel + "</b>?", 'bot'); renderUI('dataRes'); break;
                case 6: addMsg("Qual horário pretende chegar?", 'bot'); renderUI('horaRes'); break;
                case 7: addMsg("Confira os dados da sua pré-reserva:", 'bot'); renderUI('finalizar'); break;
            }
        }

        window.mostrarOpcoesPix = function() {
            removerUIAnterior();
            var cor = motels[userData.motel].cor;
            var vDesc = Math.round(userData.precoOriginal * 0.7);
            var pode3h = userData.duracao === '3h';
            var div = document.createElement('div');
            div.className = 'ui-box msg bot';
            div.style.background = 'transparent'; div.style.border = 'none';
            div.innerHTML = ''
                + '<div style="margin-bottom:8px;font-size:.9rem">💳 <b>Pagamento via PIX</b><br><span style="font-size:.8rem;color:#666">Escolha sua promoção:</span></div>'
                + '<div class="card-select" style="--cor:' + cor + ';--cor-sombra:' + cor + '66;border:2px solid gold" onclick="prepararFinalizar(\'desconto30\')">'
                + '<div style="padding:12px"><div style="font-weight:bold;color:' + cor + ';font-size:.9rem">🔥 30% de Desconto</div>'
                + '<div style="font-size:.75rem;color:#666;margin-top:4px">Pague R$ ' + vDesc + ',00 em vez de R$ ' + userData.precoOriginal + ',00</div></div></div>'
                + (pode3h ? '<div class="card-select" style="--cor:' + cor + ';--cor-sombra:' + cor + '66;border:2px solid gold" onclick="prepararFinalizar(\'mais3h\')">'
                + '<div style="padding:12px"><div style="font-weight:bold;color:' + cor + ';font-size:.9rem">🎁 3h + 3h Grátis</div>'
                + '<div style="font-size:.75rem;color:#666;margin-top:4px">Pague 3h e ganhe 6h de permanência</div></div></div>' : '')
                + '<div style="text-align:center;margin-top:8px;font-size:.75rem;color:#888">Promoções válidas apenas para pagamento antecipado via PIX</div>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        };

        window.confirmarCartao = function() { prepararFinalizar('recepcao'); };

        function prepararFinalizar(tipo) {
            userData.promocao = tipo;
            if (tipo === 'desconto30') {
                userData.preco = Math.round(userData.precoOriginal * 0.7);
                addMsg('🔥 PIX com 30% OFF - R$ ' + userData.preco + ',00', 'user');
            } else if (tipo === 'mais3h') {
                userData.duracao = '6h';
                addMsg('🎁 PIX com +3h grátis - 6h total', 'user');
            } else {
                userData.preco = userData.precoOriginal;
                addMsg('💳 Pagar com Cartão', 'user');
            }
            finalizarFluxo();
        }

        async function finalizarFluxo() {
            removerUIAnterior();
            addMsg("⏳ Registrando sua pré-reserva...", 'bot');
            var motelAtual = motels[userData.motel];
            var promoInfo = '';
            if (userData.promocao === 'desconto30') promoInfo = '30%_OFF';
            else if (userData.promocao === 'mais3h') promoInfo = '3h+3h';
            var isRecepcao = userData.promocao === 'recepcao';
            var payload = {
                motel: userData.motel,
                suite: userData.suite,
                duracao: userData.duracao,
                preco: userData.preco,
                preco_original: userData.precoOriginal,
                promocao: promoInfo,
                cliente_nome: userData.nome,
                cliente_cpf: userData.cpf,
                data_reserva: userData.dataRes,
                hora_chegada: userData.horaRes,
                status: isRecepcao ? 'pendente_recepcao' : 'aguardando_pagamento',
                origem: 'chat_web',
                criado_em: new Date().toISOString(),
                token_asaas: motelAtual ? (motelAtual.token_asaas || '') : ''
            };
            try {
                if (db) {
                    if (userData.alterandoReserva && userData.reservaExistenteId) {
                        await db.collection("reservas").doc(userData.reservaExistenteId).update({ motel:payload.motel, suite:payload.suite, duracao:payload.duracao, preco:payload.preco, preco_original:payload.preco_original, promocao:payload.promocao, cliente_nome:payload.cliente_nome, cliente_cpf:payload.cliente_cpf, data_reserva:payload.data_reserva, hora_chegada:payload.hora_chegada, status:payload.status, origem:payload.origem, token_asaas:'' });
                    } else {
                        await db.collection("reservas").add({ motel:payload.motel, suite:payload.suite, duracao:payload.duracao, preco:payload.preco, preco_original:payload.preco_original, promocao:payload.promocao, cliente_nome:payload.cliente_nome, cliente_cpf:payload.cliente_cpf, data_reserva:payload.data_reserva, hora_chegada:payload.hora_chegada, status:payload.status, origem:payload.origem, criado_em:payload.criado_em, token_asaas:'' });
                    }
                }
            } catch(e) { console.warn("Firebase save/update fail:", e); }

            var isAlteracao = userData.alterandoReserva === true;
            var tituloSucesso = isAlteracao ? "✅ <b>Pré-Reserva Alterada!</b>" : "✅ <b>Pré-Reserva Registrada!</b>";

            if (isRecepcao) {
                addMsg(tituloSucesso, 'bot');
                addMsg((isAlteracao ? '✏️ Sua reserva foi atualizada. ' : '💵 Sua reserva foi enviada para a recepção. ') + 'Apresente seu CPF no check-in.', 'bot');
                addMsg('<div style="font-size:.8rem;color:#888;text-align:center">Protocolo: ' + new Date().getTime().toString(36).toUpperCase() + '</div>', 'bot');
                return;
            }

            var paymentUrl = '';
            var errorPagamento = '';
            try {
                var resp = await fetch(APP_SCRIPT_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload) });
                var result = await resp.json();
                if (result.pagamento_url) paymentUrl = result.pagamento_url;
                if (result.payment_id) userData.paymentId = result.payment_id;
                if (result.erro) { console.warn("ASAAS error:", result.erro); errorPagamento = result.erro; }
            } catch(e) { console.warn("Apps Script fail:", e); }
            addMsg(tituloSucesso, 'bot');
            if (paymentUrl) {
                var badgePromo = promoInfo ? '<span style="display:inline-block;padding:2px 8px;border-radius:4px;background:gold;color:#000;font-size:.7rem;margin-bottom:6px">' + (promoInfo === '30%_OFF' ? '🔥 30% OFF aplicado' : '🎁 +3h grátis aplicado') + '</span><br>' : '';
                addMsg('<div style="text-align:center;padding:8px 0">'
                    + badgePromo
                    + '<p style="color:#888;font-size:.85rem;margin-bottom:10px">Sua reserva será confirmada após o pagamento.</p>'
                    + '<a href="' + paymentUrl + '" target="_blank" class="btn-action" style="display:inline-block;text-decoration:none;padding:14px 24px;font-size:1rem;border-radius:10px">💳 Pagar Agora - R$ ' + userData.preco + ',00</a>'
                    + '<p style="color:#666;font-size:.7rem;margin-top:8px">Pagamento via PIX (ASAAS)</p>'
                    + '<button class="btn-action" style="margin-top:8px;background:#333;color:#fff;font-size:.85rem;padding:10px" onclick="window.verificarPagamento()">✅ Já paguei, verificar</button></div>', 'bot');
            } else {
                addMsg(errorPagamento ? '⚠️ Erro ao gerar pagamento: ' + errorPagamento.replace('ERRO_ASAAS: ','') + '<br><small>Avise a recepção.</small>' : (motelAtual && motelAtual.token_asaas ? '⏳ Link de pagamento indisponível no momento. A recepção entrará em contato.' : '💳 Pagamento online será habilitado em breve. Apresente seu CPF na recepção.'), 'bot');
            }
            addMsg('<div style="font-size:.8rem;color:#888;text-align:center">Protocolo: ' + new Date().getTime().toString(36).toUpperCase() + '</div>', 'bot');
        };

        window.verificarPagamento = async function() {
            if (!userData.paymentId) { alert('ID do pagamento não encontrado.'); return; }
            var motelAtual = motels[userData.motel];
            addMsg("🔍 Verificando pagamento...", 'bot');
            try {
                var resp = await fetch(APP_SCRIPT_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({ acao:'verificar_pagamento', payment_id:userData.paymentId, cliente_cpf:userData.cpf, token_asaas:(motelAtual ? (motelAtual.token_asaas||'') : '') }) });
                var result = await resp.json();
                if (result.pago) { addMsg("✅ <b>Pagamento confirmado!</b> Sua reserva está agendada.", 'bot'); }
                else { addMsg('⏳ Pagamento com status: <b>' + (result.status || 'não encontrado') + '</b>. Se já pagou, aguarde alguns instantes e tente novamente.', 'bot'); }
            } catch(e) { addMsg("⚠️ Erro ao verificar pagamento. Tente novamente.", 'bot'); }
        };

        async function carregarMotels() {
            try {
                if (db) {
                    var snap = await db.collection("config").doc("motels").get();
                    if (snap.exists) { motels = snap.data().motels || JSON.parse(JSON.stringify(DADOS_PADRAO)); }
                    else { motels = JSON.parse(JSON.stringify(DADOS_PADRAO)); }
                } else { motels = JSON.parse(JSON.stringify(DADOS_PADRAO)); }
            } catch(e) {
                console.warn("Erro ao carregar motels:", e);
                motels = JSON.parse(JSON.stringify(DADOS_PADRAO));
            }
            nextStep();
        }

        window.nextStep = nextStep;
        window.onload = carregarMotels;
    </script>
</body>
</html>
