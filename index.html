        async function verificarDisponibilidade(data) {
            var msgDiv = document.getElementById('disponibilidadeMsg');
            if (!msgDiv) return true;
            msgDiv.style.display = 'block';
            msgDiv.innerHTML = '🔍 Verificando disponibilidade...';
            msgDiv.style.background = '#111';
            msgDiv.style.color = '#888';
            try {
                if (!db) return true;
                var snap = await db.collection("reservas").get();
                var docs = snap.docs;
                var todas = docs.map(function(d){ var o = d.data(); o._id = d.id; return o; });
                var statusAtivos = ['pendente_recepcao', 'pendente_cartao', 'aguardando_pagamento', 'confirmado'];
                var reservasData = todas.filter(function(r){ return r.data_reserva === data && statusAtivos.indexOf(r.status) >= 0; });
                var motelInfo = motels[userData.motel];
                var qtdeTotal = 1;
                if (motelInfo && motelInfo.suites) {
                    var sf = motelInfo.suites.find(function(s){ return s.nome === userData.suite; });
                    if (sf) qtdeTotal = sf.qtde || 1;
                }
                var reservasSuite = reservasData.filter(function(r){ return r.motel === userData.motel && r.suite === userData.suite; });
                if (reservasSuite.length >= qtdeTotal) {
                    var motelsLivres = Object.keys(motels).filter(function(nomeMotel){
                        if (nomeMotel === userData.motel) return false;
                        var suitesOcupadas = reservasData.filter(function(r){ return r.motel === nomeMotel; }).map(function(r){ return r.suite; });
                        return motels[nomeMotel].suites.some(function(s){ return suitesOcupadas.indexOf(s.nome) < 0; });
                    });
                    var msg = '❌ <b>' + userData.suite + '</b> lotada para ' + data.split('-').reverse().join('/') + ' (' + reservasSuite.length + '/' + qtdeTotal + ' reservada(s)). Que tal escolher <b>outra suíte</b> do ' + userData.motel + ' ou <b>outra data</b>?';
                    if (motelsLivres.length > 0) {
                        msg += '<br><br>📍 <b>Motéis com vagas nesta data:</b><br>';
                        motelsLivres.forEach(function(n){ msg += '<span style="color:' + motels[n].cor + '">' + motels[n].icone + ' ' + n + '</span> · '; });
                        msg = msg.slice(0, -3);
                        msg += '<br><small style="color:#888">Toque no botão Voltar e escolha outro motel</small>';
                    }
                    msgDiv.innerHTML = msg;
                    msgDiv.style.background = 'rgba(255,0,0,0.15)';
                    msgDiv.style.color = '#ff6666';
                    return false;
                }
                var mesmoCPF = reservasData.find(function(r){ return r.cliente_cpf === userData.cpf; });
                if (mesmoCPF) {
                    userData.reservaExistente = mesmoCPF;
                    userData.reservaExistenteId = mesmoCPF._id;
                    msgDiv.innerHTML = '⚠️ Você já possui uma pré-reserva para ' + data.split('-').reverse().join('/') + '.<br><br>'
                        + '<span style="font-size:.85rem">Deseja alterar essa reserva ou criar uma nova?</span><br><br>'
                        + '<div style="display:flex;gap:8px;justify-content:center">'
                        + '<button class="btn-action" style="font-size:.8rem;padding:8px 16px;background:' + (motels[userData.motel] ? motels[userData.motel].cor : '#d20150') + '" onclick="window.prosseguirAposCPF(\'alterar\')">✏️ Alterar</button>'
                        + '<button class="btn-action" style="font-size:.8rem;padding:8px 16px;background:#666" onclick="window.prosseguirAposCPF(\'nova\')">➕ Criar Nova</button></div>';
                    msgDiv.style.background = 'rgba(255,200,0,0.15)';
                    msgDiv.style.color = '#ffcc00';
                    return false;
                }
                var dispMsg = qtdeTotal - reservasSuite.length;
                msgDiv.innerHTML = '✅ Data disponível! (' + dispMsg + ' vaga(s) restante(s) nesta suíte). Confirme o horário.';
                msgDiv.style.background = 'rgba(0,255,0,0.1)';
                msgDiv.style.color = 'var(--primary)';
                return true;
            } catch(e) {
                console.warn("Erro ao verificar disponibilidade:", e);
                msgDiv.innerHTML = '⚠️ Não foi possível verificar automaticamente. Sua reserva será analisada pela recepção.';
                msgDiv.style.background = 'rgba(255,200,0,0.1)';
                msgDiv.style.color = '#ffcc00';
                return true;
            }
        }

                userData.alterandoReserva = true;

            } else {

        function validarCPF(cpf) {
            var nums = cpf.replace(/\D/g, '');
            if (nums.length !== 11 || /^(\d)\1{10}$/.test(nums)) return false;
            function calc(digitos, pesos) {
                var soma = 0;
                for (var i = 0; i < digitos.length; i++) soma += digitos[i] * pesos[i];
                var resto = soma % 11;
                return resto < 2 ? 0 : 11 - resto;
            }
            var d1 = calc(nums.slice(0,9).split('').map(Number), [10,9,8,7,6,5,4,3,2]);
            var d2 = calc(nums.slice(0,10).split('').map(Number), [11,10,9,8,7,6,5,4,3,2]);
            return d1 === Number(nums[9]) && d2 === Number(nums[10]);
        }

                addMsg(cpf, 'user'); userData.cpf = cpf; step++;

                if (!data) return;
                addMsg(data.split('-').reverse().join('/'), 'user');

            } else if (tipo === 'horaRes') {
                var hora = document.getElementById('uiHoraRes').value;
                if (!hora) return;
                var agora = new Date();

                addMsg(hora, 'user'); userData.horaRes = hora; step++;
            }
            removerUIAnterior();
            setTimeout(nextStep, 500);
        };

                + '<div style="padding:12px"><div style="font-weight:bold;color:' + cor + ';font-size:.9rem">🔥 30% de Desconto</div>'
                + '<div style="font-size:.75rem;color:#666;margin-top:4px">Pague R$ ' + vDesc + ',00 em vez de R$ ' + userData.precoOriginal + ',00</div></div></div>'
                + (pode3h ? '<div class="card-select" style="--cor:' + cor + ';--cor-sombra:' + cor + '66;border:2px solid gold" onclick="prepararFinalizar(\'mais3h\')">'
                + '<div style="padding:12px"><div style="font-weight:bold;color:' + cor + ';font-size:.9rem">🎁 3h + 3h Grátis</div>'
                + '<div style="font-size:.75rem;color:#666;margin-top:4px">Pague 3h e ganhe 6h de permanência</div></div></div>' : '')
                + '<div style="text-align:center;margin-top:8px;font-size:.75rem;color:#888">Promoções válidas apenas para pagamento antecipado via PIX</div>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        };

        window.confirmarCartao = function() { prepararFinalizar('cartao'); };

        function prepararFinalizar(tipo) {
            userData.promocao = tipo;
            if (tipo === 'desconto30') {
                userData.preco = Math.round(userData.precoOriginal * 0.7);
                addMsg('🔥 PIX com 30% OFF - R$ ' + userData.preco + ',00', 'user');
            } else if (tipo === 'mais3h') {
                userData.duracao = '6h';
                addMsg('🎁 PIX com +3h grátis - 6h total', 'user');
            } else {
                userData.preco = userData.precoOriginal;
                addMsg('💳 Pagar com Cartão', 'user');
            }
            finalizarFluxo();
        }

        async function finalizarFluxo() {
            removerUIAnterior();
            addMsg("⏳ Registrando sua pré-reserva...", 'bot');
            var protocolo = new Date().getTime().toString(36).toUpperCase();
            userData.protocolo = protocolo;
            var motelAtual = motels[userData.motel];
            var promoInfo = '';
            if (userData.promocao === 'desconto30') promoInfo = '30%_OFF';
            else if (userData.promocao === 'mais3h') promoInfo = '3h+3h';
            var isRecepcao = userData.promocao === 'recepcao';
            var isCartao = userData.promocao === 'cartao';
            var isPix = !isRecepcao && !isCartao && !modoTeste;
            userData.statusVoucher = isRecepcao ? 'PENDENTE' : isCartao ? 'PENDENTE CARTAO' : isPix ? 'AGUARDANDO PAGAMENTO' : 'CONFIRMADO';
            var payload = {
                motel: userData.motel,
                suite: userData.suite,
                duracao: userData.duracao,
                preco: userData.preco,
                preco_original: userData.precoOriginal,
                promocao: promoInfo,
                cliente_nome: userData.nome,
                cliente_cpf: userData.cpf,
                data_reserva: userData.dataRes,
                hora_chegada: userData.horaRes,
                protocolo: userData.protocolo,
                status: isRecepcao ? 'pendente_recepcao' : isCartao ? 'pendente_cartao' : 'aguardando_pagamento',
                origem: 'chat_web',
                criado_em: new Date().toISOString(),
                token_asaas: motelAtual ? (motelAtual.token_asaas || '') : ''
            };
            var reservaId = null;
            try {
                if (db) {
                    if (userData.alterandoReserva && userData.reservaExistenteId) {
                        await db.collection("reservas").doc(userData.reservaExistenteId).update({ motel:payload.motel, suite:payload.suite, duracao:payload.duracao, preco:payload.preco, preco_original:payload.preco_original, promocao:payload.promocao, cliente_nome:payload.cliente_nome, cliente_cpf:payload.cliente_cpf, data_reserva:payload.data_reserva, hora_chegada:payload.hora_chegada, protocolo:payload.protocolo, status:payload.status, origem:payload.origem, token_asaas:payload.token_asaas });
                        reservaId = userData.reservaExistenteId;
                    } else {
                        var ref = await db.collection("reservas").add({ motel:payload.motel, suite:payload.suite, duracao:payload.duracao, preco:payload.preco, preco_original:payload.preco_original, promocao:payload.promocao, cliente_nome:payload.cliente_nome, cliente_cpf:payload.cliente_cpf, data_reserva:payload.data_reserva, hora_chegada:payload.hora_chegada, protocolo:payload.protocolo, status:payload.status, origem:payload.origem, criado_em:payload.criado_em, token_asaas:payload.token_asaas });
                        reservaId = ref.id;
                    }
                }
            } catch(e) { console.warn("Firebase save/update fail:", e); }

            var isAlteracao = userData.alterandoReserva === true;
            var tituloSucesso = isAlteracao ? "✅ <b>Pré-Reserva Alterada!</b>" : "✅ <b>Pré-Reserva Registrada!</b>";

            if (isRecepcao || isCartao) {
                addMsg(tituloSucesso, 'bot');
                addMsg((isAlteracao ? '✏️ Sua reserva foi atualizada. ' : '💵 Sua reserva foi enviada para a recepção. ') + (isCartao ? 'Pagamento com cartão será confirmado na recepção.' : 'Apresente seu CPF no check-in.'), 'bot');
                addMsg('<div style="font-size:.8rem;color:#888;text-align:center">Protocolo: ' + userData.protocolo + '</div>', 'bot');
                addMsg('<div style="text-align:center;margin-top:4px"><button class="btn-action" style="background:#333;font-size:.85rem;padding:10px" onclick="window.mostrarComprovante()">📄 Meu Comprovante</button></div>', 'bot');
                fetch(APP_SCRIPT_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({ acao:'notificar', motel:payload.motel, suite:payload.suite, duracao:payload.duracao, preco:payload.preco, cliente_nome:payload.cliente_nome, cliente_cpf:payload.cliente_cpf, data_reserva:payload.data_reserva, hora_chegada:payload.hora_chegada, status:isCartao ? 'pendente_cartao' : 'pendente_recepcao' }) }).catch(function(){});
                return;
            }

            var paymentUrl = '';
            var errorPagamento = '';
            if (modoTeste) {
                paymentUrl = '#test';
                userData.paymentId = 'test_' + Date.now();
                if (reservaId) {
                    await db.collection("reservas").doc(reservaId).update({ payment_id: userData.paymentId, status: 'confirmado', modo_teste: true }).catch(function(){});
                }
                addMsg(tituloSucesso, 'bot');
                addMsg('🧪 <b>MODO TESTE</b> — Reserva confirmada sem pagamento.', 'bot');
                addMsg('<div style="font-size:.8rem;color:#888;text-align:center">Protocolo: ' + userData.protocolo + '</div>', 'bot');
                addMsg('<div style="text-align:center;margin-top:4px"><button class="btn-action" style="background:#333;font-size:.85rem;padding:10px" onclick="window.mostrarComprovante()">📄 Meu Comprovante</button></div>', 'bot');
                return;
            }
            try {
                var resp = await fetch(APP_SCRIPT_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload) });
                var result = await resp.json();
                if (result.pagamento_url) paymentUrl = result.pagamento_url;
                if (result.payment_id) {
                    userData.paymentId = result.payment_id;
                    localStorage.setItem('ultimo_payment_id', result.payment_id);
                    localStorage.setItem('ultimo_cpf', userData.cpf);
                    localStorage.setItem('ultimo_motel', userData.motel);
                    localStorage.setItem('ultimo_protocolo', userData.protocolo);
                    localStorage.setItem('ultimo_token_asaas', payload.token_asaas || '');
                    if (reservaId) {
                        await db.collection("reservas").doc(reservaId).update({ payment_id: result.payment_id }).catch(function(){});
                    }
                }
                if (result.erro) { console.warn("ASAAS error:", result.erro); errorPagamento = result.erro; }
            } catch(e) { console.warn("Apps Script fail:", e); }
            addMsg(tituloSucesso, 'bot');
            if (paymentUrl) {
                var badgePromo = promoInfo ? '<span style="display:inline-block;padding:2px 8px;border-radius:4px;background:gold;color:#000;font-size:.7rem;margin-bottom:6px">' + (promoInfo === '30%_OFF' ? '🔥 30% OFF aplicado' : '🎁 +3h grátis aplicado') + '</span><br>' : '';
                addMsg('<div style="text-align:center;padding:8px 0">'
                    + badgePromo
                    + '<p style="color:#888;font-size:.85rem;margin-bottom:10px">Sua reserva será confirmada após o pagamento.</p>'
                    + '<button class="btn-action" style="padding:14px 24px;font-size:1rem;border-radius:10px" onclick="window.pagarAgora(\'' + paymentUrl + '\')">💳 Pagar Agora - R$ ' + userData.preco + ',00</button>'
                    + '<p style="color:#666;font-size:.7rem;margin-top:8px">Pagamento via PIX (ASAAS)</p>'
                    + '<button class="btn-action" style="margin-top:8px;background:#333;color:#fff;font-size:.85rem;padding:10px" onclick="window.verificarPagamento()">✅ Já paguei, verificar</button></div>', 'bot');
            } else {
                addMsg(errorPagamento ? '⚠️ Erro ao gerar pagamento: ' + errorPagamento.replace('ERRO_ASAAS: ','') + '<br><small>Avise a recepção.</small>' : (motelAtual && motelAtual.token_asaas ? '⏳ Link de pagamento indisponível no momento. A recepção entrará em contato.' : '💳 Pagamento online será habilitado em breve. Apresente seu CPF na recepção.'), 'bot');
            }
            addMsg('<div style="font-size:.8rem;color:#888;text-align:center">Protocolo: ' + userData.protocolo + '</div>', 'bot');
        };

        window.pagarAgora = function(url) {
            window.open(url, '_blank');
            addMsg('💳 Pagamento aberto em nova aba. Acompanhando status automaticamente...', 'bot');
            if (window.pagamentoPollInterval) clearInterval(window.pagamentoPollInterval);
            var tentativas = 0;
            window.pagamentoPollInterval = setInterval(async function() {
                var pid = userData.paymentId || localStorage.getItem('ultimo_payment_id');
                if (!pid) { tentativas++; if (tentativas > 3) { clearInterval(window.pagamentoPollInterval); window.pagamentoPollInterval = null; } return; }
                try {
                    var motelNome = userData.motel || localStorage.getItem('ultimo_motel') || '';
                    var motelAtual = motels[motelNome] || null;
                    var cpf = userData.cpf || localStorage.getItem('ultimo_cpf') || '';
                    var token = (motelAtual ? motelAtual.token_asaas : '') || localStorage.getItem('ultimo_token_asaas') || '';
                    var resp = await fetch(APP_SCRIPT_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({ acao:'verificar_pagamento', payment_id:pid, cliente_cpf:cpf, token_asaas:token }) });
                    var result = await resp.json();
                    if (result.pago) {
                        clearInterval(window.pagamentoPollInterval);
                        window.pagamentoPollInterval = null;
                        userData.statusVoucher = 'CONFIRMADO';
                        localStorage.removeItem('ultimo_payment_id');
                        localStorage.removeItem('ultimo_cpf');
                        localStorage.removeItem('ultimo_motel');
                        localStorage.removeItem('ultimo_protocolo');
                        localStorage.removeItem('ultimo_token_asaas');
                        if (db) {
                            var qP = await db.collection("reservas").where("payment_id", "==", pid).limit(1).get();
                            if (!qP.empty) {
                                await qP.docs[0].ref.update({ status: 'confirmado' }).catch(function(e){ console.warn("Falha ao atualizar status:", e); });
                            }
                        }
                        addMsg("✅ <b>Pagamento confirmado!</b> Sua reserva está agendada.", 'bot');
                        addMsg('<div style="text-align:center;margin-top:4px"><button class="btn-action" style="background:#333;font-size:.85rem;padding:10px" onclick="window.mostrarComprovante()">📄 Meu Comprovante</button></div>', 'bot');
                    }
                } catch(e) { console.warn("Polling error:", e); }
            }, 10000);
            setTimeout(function() {
                if (window.pagamentoPollInterval) {
                    clearInterval(window.pagamentoPollInterval);
                    window.pagamentoPollInterval = null;
                    addMsg('⏱️ A verificação automática encerrou. Use "✅ Já paguei, verificar" para conferir.', 'bot');
                }
            }, 300000);
        };

        window.verificarPagamento = async function(cpfForcado) {
            var reservaDocId = null;
            if (!userData.paymentId) {
                var savedId = localStorage.getItem('ultimo_payment_id');
                if (savedId) {
                    userData.paymentId = savedId;
                    if (!userData.cpf) userData.cpf = localStorage.getItem('ultimo_cpf') || '';
                    if (!userData.motel) userData.motel = localStorage.getItem('ultimo_motel') || '';
                    if (!userData.protocolo) userData.protocolo = localStorage.getItem('ultimo_protocolo') || '';
                }
            }
            if (!userData.paymentId) {
                var cpfBusca = cpfForcado || userData.cpf || localStorage.getItem('ultimo_cpf');
                var protocoloBusca = userData.protocolo || localStorage.getItem('ultimo_protocolo') || '';
                if (protocoloBusca && db) {
                    var q = await db.collection("reservas").where("protocolo", "==", protocoloBusca).limit(1).get();
                    if (!q.empty) {
                        reservaDocId = q.docs[0].id;
                        var d = q.docs[0].data();
                        if (d.payment_id) {
                            userData.paymentId = d.payment_id;
                            userData.cpf = d.cliente_cpf || cpfBusca;
                            userData.motel = d.motel || '';
                            userData.protocolo = d.protocolo || '';
                            localStorage.setItem('ultimo_payment_id', d.payment_id);
                            localStorage.setItem('ultimo_cpf', userData.cpf);
                            localStorage.setItem('ultimo_motel', userData.motel);
                            localStorage.setItem('ultimo_protocolo', userData.protocolo);
                        }
                    }
                } else if (cpfBusca && db) {
                    var q = await db.collection("reservas").where("cliente_cpf", "==", cpfBusca).orderBy("criado_em", "desc").limit(1).get();
                    if (!q.empty) {
                        reservaDocId = q.docs[0].id;
                        var d = q.docs[0].data();
                        if (d.payment_id) {
                            userData.paymentId = d.payment_id;
                            userData.cpf = d.cliente_cpf || cpfBusca;
                            userData.motel = d.motel || '';
                            userData.protocolo = d.protocolo || '';
                            localStorage.setItem('ultimo_payment_id', d.payment_id);
                            localStorage.setItem('ultimo_cpf', userData.cpf);
                            localStorage.setItem('ultimo_motel', userData.motel);
                            localStorage.setItem('ultimo_protocolo', userData.protocolo);
                        }
                    }
                }
            }
            if (!userData.paymentId) {
                var cpfInput = prompt("Digite seu CPF para localizar a reserva:");
                if (cpfInput) return window.verificarPagamento(cpfInput);
                return;
            }
            var motelAtual = motels[userData.motel];
            var tokenAsaas = (motelAtual ? motelAtual.token_asaas : '') || localStorage.getItem('ultimo_token_asaas') || '';
            addMsg("🔍 Verificando pagamento...", 'bot');
            try {
                var resp = await fetch(APP_SCRIPT_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({ acao:'verificar_pagamento', payment_id:userData.paymentId, cliente_cpf:userData.cpf, token_asaas:tokenAsaas }) });
                var result = await resp.json();
                if (result.pago) {
                    userData.statusVoucher = 'CONFIRMADO';
                    localStorage.removeItem('ultimo_payment_id');
                    localStorage.removeItem('ultimo_cpf');
                    localStorage.removeItem('ultimo_motel');
                    localStorage.removeItem('ultimo_protocolo');
                    localStorage.removeItem('ultimo_token_asaas');
                    if (db) {
                        var ref = reservaDocId ? db.collection("reservas").doc(reservaDocId) : null;
                        if (!ref && userData.paymentId) {
                            var qP = await db.collection("reservas").where("payment_id", "==", userData.paymentId).limit(1).get();
                            if (!qP.empty) ref = qP.docs[0].ref;
                        }
                        if (!ref && userData.protocolo) {
                            var q2 = await db.collection("reservas").where("protocolo", "==", userData.protocolo).limit(1).get();
                            if (!q2.empty) ref = q2.docs[0].ref;
                        }
                        if (ref) await ref.update({ status: 'confirmado' }).catch(function(e){ console.warn("Falha ao atualizar status:", e); });
                    }
                    addMsg("✅ <b>Pagamento confirmado!</b> Sua reserva está agendada.", 'bot');
                    addMsg('<div style="text-align:center;margin-top:4px"><button class="btn-action" style="background:#333;font-size:.85rem;padding:10px" onclick="window.mostrarComprovante()">📄 Meu Comprovante</button></div>', 'bot');
                }
                else { addMsg('⏳ Pagamento com status: <b>' + (result.status || 'não encontrado') + '</b>. Se já pagou, aguarde alguns instantes e tente novamente.', 'bot'); }
            } catch(e) { addMsg("⚠️ Erro ao verificar pagamento. Tente novamente.", 'bot'); }
        };

        window.mostrarComprovante = function() {
            var m = motels[userData.motel] || {};
            var protocolo = userData.protocolo || new Date().getTime().toString(36).toUpperCase();
            var statusTexto = userData.statusVoucher || 'CONFIRMADO';
            var statusIcon = statusTexto === 'CONFIRMADO' ? '✅' : statusTexto === 'PENDENTE' ? '⏳' : '🟡';
            var cor = m.cor || '#d20150';
            addMsg('<div style="background:#fff;border:1px solid #e0d0e8;border-radius:16px;padding:16px;max-width:100%">'
                + '<div style="text-align:center;border-bottom:2px solid ' + cor + ';padding-bottom:12px;margin-bottom:14px">'
                + '<div style="font-weight:700;color:' + cor + ';font-size:1.1rem;letter-spacing:1px">Pré-reserva online</div>'
                + '<div style="color:#888;font-size:.75rem">Motéis Fortaleza</div></div>'
                + '<div style="text-align:center;margin:10px 0"><img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=' + encodeURIComponent(protocolo) + '" style="width:120px;height:120px;border:1px solid #eee;border-radius:8px"></div>'
                + '<div class="resumo-item"><span>Motel</span><span>' + m.icone + ' ' + userData.motel + '</span></div>'
                + '<div class="resumo-item"><span>Suíte</span><span>' + userData.suite + '</span></div>'
                + '<div class="resumo-item"><span>Período</span><span>' + userData.duracao + '</span></div>'
                + '<div class="resumo-item"><span>Data</span><span>' + (userData.dataRes ? userData.dataRes.split('-').reverse().join('/') : '') + '</span></div>'
                + '<div class="resumo-item"><span>Horário</span><span>' + userData.horaRes + '</span></div>'
                + '<div class="resumo-item"><span>Cliente</span><span>' + userData.nome + '</span></div>'
                + '<div class="resumo-item"><span>CPF</span><span>' + userData.cpf + '</span></div>'
                + '<div class="resumo-item"><span>Valor</span><span>R$ ' + userData.preco + ',00</span></div>'
                + '<div style="padding:8px 12px;border-radius:8px;text-align:center;font-weight:700;font-size:.9rem;margin:14px 0;background:' + (statusTexto === 'CONFIRMADO' ? '#d4edda' : '#fff3cd') + ';color:' + (statusTexto === 'CONFIRMADO' ? '#155724' : '#856404') + '">' + statusIcon + ' ' + statusTexto + '</div>'
                + '<div style="text-align:center;font-size:.8rem;color:#888;border-top:1px solid #eee;padding-top:12px">🎉 Apresente este comprovante na recepção junto com seu CPF</div>'
                + '<div style="text-align:center;font-size:.7rem;color:#aaa;margin-top:6px;letter-spacing:1px">Protocolo: ' + protocolo + '</div>'
                + '</div>', 'bot');
        };
        async function carregarMotels() {
            try {
                if (db) {
                    var snap = await db.collection("config").doc("motels").get();
                    if (snap.exists) {
                        motels = snap.data().motels;
                        var tokenOk = motels[Object.keys(motels)[0]]?.token_asaas;
                        console.log("Motels carregados do Firestore, token_asaas presente:", !!tokenOk);
                    } else {
                        console.log("Documento config/motels nao existe no Firestore, usando fallback");
                        motels = JSON.parse(JSON.stringify(DADOS_PADRAO));
                    }
                } else {
                    console.log("db nao disponivel, usando fallback");
                    motels = JSON.parse(JSON.stringify(DADOS_PADRAO));
                }
            } catch(e) {
                console.warn("Erro ao carregar motels:", e);
                motels = JSON.parse(JSON.stringify(DADOS_PADRAO));
            }
            nextStep();
        }

        window.nextStep = nextStep;
        window.onload = async function() {
            var tinhaPendente = false;
            var pid = localStorage.getItem('ultimo_payment_id');
            if (pid && !pid.startsWith('test_')) {
                tinhaPendente = true;
                userData.paymentId = pid;
                userData.cpf = localStorage.getItem('ultimo_cpf') || '';
                userData.motel = localStorage.getItem('ultimo_motel') || '';
                userData.protocolo = localStorage.getItem('ultimo_protocolo') || '';
            }
            if (auth) {
                try {
                    await auth.signInAnonymously();
                    console.log("Auth anonimo OK");
                } catch(e) {
                    console.warn("Auth anonimo falhou, usando fallback:", e);
                }
            }
            await carregarMotels();
            if (tinhaPendente && userData.paymentId) {
                addMsg("🔄 Verificando pagamento pendente...", 'bot');
                await window.verificarPagamento();
            }
        };
    </script>
</body>
</html>
